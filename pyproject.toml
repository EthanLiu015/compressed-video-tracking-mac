[project]
name = "mvtrack"
version = "0.1.0"
description = "Compressed-domain video analytics: MV-propagated multi-object tracking on Apple Silicon"
requires-python = ">=3.10"
dependencies = [
    "av>=12",
    "numpy",
    "opencv-python",
    "torch>=2.2",
    "torchreid",
    "huggingface_hub",
    "gdown",  # transitive import inside torchreid's data module, unused directly
    "tensorboard",  # transitive import inside torchreid's engine module, unused directly
    "ultralytics>=8.2",
    "scipy",
    "tqdm",
    "pandas",
    "matplotlib",
    "certifi",
    "trackeval @ git+https://github.com/JonathonLuiten/TrackEval.git",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
